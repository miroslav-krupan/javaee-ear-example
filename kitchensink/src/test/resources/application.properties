# Test datasource — H2 in-memory (overrides main application.properties for test contexts)
# H2 dependency is <scope>test</scope> in pom.xml; this config is only active in test runs.
spring.datasource.url=jdbc:h2:mem:kitchensink-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
