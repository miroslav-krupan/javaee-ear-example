spring.application.name=kitchensink

# Datasource — replaces JNDI jdbc/SSA (source: ejb/src/main/resources/META-INF/persistence.xml)
spring.datasource.url=jdbc:h2:mem:kitchensink;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway — replaces hbm2ddl.auto=create-drop
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# JPA — Hibernate validates against Flyway-managed schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# DeltaSpike config.key replacement
config.key=Default value
