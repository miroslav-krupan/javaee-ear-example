spring.application.name=kitchensink

# Datasource — configure for deployment target (source: ejb/src/main/resources/META-INF/persistence.xml jdbc/SSA)
# spring.datasource.url=jdbc:postgresql://host/db
# spring.datasource.username=
# spring.datasource.password=

# Flyway — replaces hbm2ddl.auto=create-drop
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# JPA — Hibernate validates against Flyway-managed schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# DeltaSpike config.key replacement
config.key=Default value
