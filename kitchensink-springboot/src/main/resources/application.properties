spring.application.name=kitchensink

# Session timeout — migrated from web.xml (30 minutes)
server.servlet.session.timeout=30m

# DeltaSpike ConfigResolver replacement (from web2/META-INF/apache-deltaspike.properties)
config.key=configuration value from deltaspike file

# H2 in-memory datasource (dev default; replace with production DB coordinates)
spring.datasource.url=jdbc:h2:mem:kitchensink;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — Flyway owns DDL; Hibernate validates schema only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Virtual threads (Java 21 Loom)
spring.threads.virtual.enabled=true
