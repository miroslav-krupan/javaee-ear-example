spring.application.name=kitchensink-springboot

# Session timeout — migrated from web.xml (30 minutes)
server.servlet.session.timeout=30m

# DeltaSpike ConfigResolver replacement (from web2/META-INF/apache-deltaspike.properties)
config.key=Default value

# JPA — Flyway owns DDL; Hibernate validates schema only
spring.jpa.hibernate.ddl-auto=validate

# Datasource — placeholder; Persistence specialist fills in production DB coordinates
# spring.datasource.url=jdbc:...
# spring.datasource.username=...
# spring.datasource.password=...
# spring.datasource.driver-class-name=...
